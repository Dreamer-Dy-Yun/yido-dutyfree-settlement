# PostgreSQL + pgAdmin + Redis (DATABASE/config.py 湲곕낯媛믨낵 留욎땄)
services:
  postgres:
    image: postgres:16-alpine
    container_name: yido_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: "123!@#qwe"
      POSTGRES_DB: db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: yido_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: yido.repository@gmail.com
      PGADMIN_DEFAULT_PASSWORD: "123!@#qwe"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: yido_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  match_worker:
    image: python:3.11-slim
    container_name: yido_match_worker
    working_dir: /app
    volumes:
      - ./:/app
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - WEB_API_BASE_URL=http://host.docker.internal:10000
    command: >
      sh -c "pip install -r requirements.txt && python -m PROCESSOR_MATCHING.run_match_worker"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data: