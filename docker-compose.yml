# Backend orchestration for local PostgreSQL, Redis, pgAdmin, API, nginx, and workers.
# Run from the backend repository root: D:\DEV\YIDO\backend.
# Frontend static files are built by the sibling frontend repository.
services:
  nginx:
    image: nginx:1.27-alpine
    container_name: yido_nginx
    ports:
      - "${NGINX_HOST_PORT:-80}:80"
    volumes:
      - ./infra/nginx/compose.default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${NGINX_FRONTEND_DIST:-../frontend/dist}:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: .
    image: yido-dutyfree-backend:local
    container_name: yido_backend
    ports:
      - "${BACKEND_HOST_PORT:-10000}:10000"
    env_file:
      - ${BACKEND_ENV_FILE:-./.env}
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - ROOT_DIR=/app/data
      - WEB_API_BASE_URL=http://backend:10000
      - APP_URL=http://localhost:${NGINX_HOST_PORT:-80}
      - WEB_SERVER_HOST=0.0.0.0
      - WEB_SERVER_PORT=10000
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:10000/docs', timeout=2).read()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: yido_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123!@#qwe}
      POSTGRES_DB: ${DB_NAME:-db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: yido_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-yido.repository@gmail.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-123!@#qwe}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: yido_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  match_worker:
    build:
      context: .
    image: yido-dutyfree-backend:local
    container_name: yido_match_worker
    env_file:
      - ${BACKEND_ENV_FILE:-./.env}
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - ROOT_DIR=/app/data
      - WEB_API_BASE_URL=http://backend:10000
    volumes:
      - backend_data:/app/data
    command: ["python", "-m", "PROCESSOR_MATCHING.run_match_worker"]
    depends_on:
      backend:
        condition: service_healthy

  edi_unified_worker:
    build:
      context: .
    image: yido-dutyfree-backend:local
    container_name: yido_edi_unified_worker
    env_file:
      - ${BACKEND_ENV_FILE:-./.env}
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - ROOT_DIR=/app/data
      - WEB_API_BASE_URL=http://backend:10000
    volumes:
      - backend_data:/app/data
    command: ["python", "-m", "PROCESSOR_DATA.run_edi_unified_worker"]
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  backend_data: